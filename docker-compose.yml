version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: linktraffic_mysql
    restart: always
    environment:
      MYSQL_DATABASE: linktraffic_db
      MYSQL_USER: linktraffic_user
      MYSQL_PASSWORD: secure_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: